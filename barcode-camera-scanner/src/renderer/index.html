<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Barcode Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>POS Barcode Scanner</h1>
            <div class="controls">
                <select id="camera-select" class="camera-select">
                    <option value="">Loading cameras...</option>
                </select>
                <button id="start-btn" class="btn btn-primary">Start Camera</button>
                <button id="stop-btn" class="btn btn-danger" disabled>Stop Camera</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Panel: Scanner -->
            <div class="scanner-panel">
                <div class="video-container">
                    <video id="video" autoplay playsinline width="100%" height="100%"></video>
                    <div class="scanner-overlay">
                        <div class="laser"></div>
                    </div>
                </div>
                <div id="status" class="status-indicator">Camera Ready</div>
            </div>

            <!-- Right Panel: Info -->
            <div class="info-panel">
                <div class="panel-section">
                    <h2>Instructions</h2>
                    <p class="placeholder-text">Phase 1: Basic Camera Preview Foundation.</p>
                    <p class="placeholder-text">Select a camera and click "Start Camera" to preview.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="camera.js"></script>
</body>
</html>
