<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Barcode Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>POS Barcode Scanner</h1>
            <div class="controls">
                <select id="camera-select" class="camera-select">
                    <option value="">Loading cameras...</option>
                </select>
                <button id="start-btn" class="btn btn-primary">Start Scanner</button>
                <button id="stop-btn" class="btn btn-danger" disabled>Stop Scanner</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Panel: Scanner -->
            <div class="scanner-panel">
                <div class="video-container">
                    <video id="video" width="100%" height="100%"></video>
                    <div class="scanner-overlay">
                        <div class="laser"></div>
                    </div>
                </div>
                <div id="status" class="status-indicator">Scanner Ready</div>
            </div>

            <!-- Right Panel: Info -->
            <div class="info-panel">
                <div class="panel-section settings-section">
                    <h2>Settings</h2>
                    <label class="setting-item">
                        <input type="checkbox" id="wedge-mode-checkbox">
                        <strong>Enable Keyboard Wedge Mode</strong>
                    </label>
                    <div id="wedge-settings" class="wedge-settings disabled">
                        <label>
                            Delay before typing (ms):
                            <input type="number" id="delay-typing" value="0" min="0" max="500">
                        </label>
                        <label>
                            Delay before Enter (ms):
                            <input type="number" id="delay-enter" value="0" min="0" max="1000">
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <h2>Last Scanned</h2>
                    <div id="last-scanned" class="scan-result-large">---</div>
                </div>

                <div class="panel-section">
                    <h2>Scan History</h2>
                    <div class="history-list" id="history-list">
                        <!-- History items will be appended here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- The audio for beep -->
    <audio id="beep" src="../../assets/beep.mp3"></audio>

    <script src="../../node_modules/@zxing/library/umd/index.min.js"></script>
    <script src="../../node_modules/@zxing/browser/umd/zxing-browser.min.js"></script>
    <script src="camera.js"></script>
</body>
</html>
